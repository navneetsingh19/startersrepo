{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" />
    
    <link rel="stylesheet" href="{% static 'css/index.css' %}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Font Awesome 5 Brands:wght@400&display=swap" />

<script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="signup-login">
        <div class="signup-box">
            <form method="post">
                {% csrf_token %}
                <div class="heading">
                    Signup
                </div>
                <div class="line"></div>
                <div class="field">
                    <div class="field">
                    <b>Username</b>
                    <input class="inp" type="text" name="fnm" required placeholder="Enter Your Full Name">
                </div>
                <div class="field">
                    <b>Email</b>
                    <input type="email" required class="inp" name="emailid">
                </div>
                <div class="field">
                    <b>Password</b>
                    <input type="password" required class="inp" name="pwd" required >
                    <div class="fields">
                        <input type="submit" class="submit button" value="Signup">
                    </div>
                </div>
                <div class="field">
                    <b>Already have an account</b>
                    <br>
                    <a class="anc"href="/loginn">Login</a>
                </div>
            </div>
        </form>
        </div>
    </div>
</body>
</html>
